  configuration:
  - name: ios_config.txt
    content: "hostname CORE\nclock timezone UTC 0 0\nntp master 3\nbanner motd #\n==============================================================\n CORE  |  Center  |  IOL XE 17.16.01a\n Role: Core P + VPNv4 route reflector (no VRFs). Lab NTP server\n Data links:\n   Ethernet0/0            -> PE-A GigabitEthernet0/0/0/0\n   Ethernet0/1            -> PE-B GigabitEthernet0/0/0/0\n   Ethernet0/2            -> PE-ACC Ethernet0/0\n   OOB 10.250.0.11/24 (management, global table)\n Users: cisco/cisco or admin/C1sco12345\n Verify the lab: on COLLECTOR run  labcheck <stage 1-4>\n==============================================================\n#\nusername cisco privilege 15 secret cisco\nusername admin privilege 15 secret C1sco12345\nno ip domain lookup\nip domain name lab.local\nip ssh version 2\ninterface Ethernet1/1\n description OOB\n ip address 10.250.0.11 255.255.255.0\n no shutdown\nline con 0\n exec-timeout 0 0\n logging synchronous\nline vty 0 4\n login local\n transport input ssh\n exec-timeout 0 0\nevent manager applet GENKEYS authorization bypass\n event timer countdown name GK time 45\n action 1.0 cli command \"enable\"\n action 2.0 cli command \"show crypto key mypubkey rsa\"\n action 3.0 regexp \"Key name\" \"$_cli_result\"\n action 4.0 if $_regexp_result eq \"0\"\n action 5.0  cli command \"configure terminal\"\n action 6.0  cli command \"crypto key generate rsa modulus 2048\"\n action 7.0  cli command \"end\"\n action 8.0 end\ninterface Loopback0\n ip address 10.255.0.1 255.255.255.255\n!\ninterface Ethernet0/0\n description to PE-A\n ip address 10.100.10.0 255.255.255.254\n no shutdown\n!\ninterface Ethernet0/1\n description to PE-B\n ip address 10.100.10.2 255.255.255.254\n no shutdown\n!\ninterface Ethernet0/2\n description to PE-ACC\n ip address 10.100.10.4 255.255.255.254\n no shutdown\n!\nend"
