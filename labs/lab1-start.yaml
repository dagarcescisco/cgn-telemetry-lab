  - name: ios_config.txt
    content: "hostname PE-ACC\nclock timezone UTC 0 0\nntp server 10.250.0.11\nbanner motd #\n==============================================================\n PE-ACC  |  Access  |  IOL XE 17.16.01a\n Role: Access PE (PC_PE): SUB, INET-SRV and COLLECTOR hang off it\n Data links:\n   Ethernet0/0            -> CORE Ethernet0/2\n   Ethernet0/1            -> SUB eth0\n   Ethernet0/2            -> INET-SRV eth0\n   Ethernet0/3            -> COLLECTOR ens2\n   OOB 10.250.0.18/24 (management, global table)\n Users: cisco/cisco or admin/C1sco12345\n Verify the lab: on COLLECTOR run  labcheck <stage 1-4>\n==============================================================\n#\nusername cisco privilege 15 secret cisco\nusername admin privilege 15 secret C1sco12345\nno ip domain lookup\nip domain name lab.local\nip ssh version 2\ninterface Ethernet1/0\n description OOB\n ip address 10.250.0.18 255.255.255.0\n no shutdown\nline con 0\n exec-timeout 0 0\n logging synchronous\nline vty 0 4\n login local\n transport input ssh\n exec-timeout 0 0\nevent manager applet GENKEYS authorization bypass\n event timer countdown name GK time 45\n action 1.0 cli command \"enable\"\n action 2.0 cli command \"show crypto key mypubkey rsa\"\n action 3.0 regexp \"Key name\" \"$_cli_result\"\n action 4.0 if $_regexp_result eq \"0\"\n action 5.0  cli command \"configure terminal\"\n action 6.0  cli command \"crypto key generate rsa modulus 2048\"\n action 7.0  cli command \"end\"\n action 8.0 end\nip vrf MOB-A\n rd 10.255.0.2:101\n!\nip vrf MOB-B\n rd 10.255.0.2:102\n!\nip vrf INET\n rd 10.255.0.2:103\n!\nip vrf TLM\n rd 10.255.0.2:104\n!\ninterface Loopback0\n ip address 10.255.0.2 255.255.255.255\n!\ninterface Loopback2\n ip vrf forwarding TLM\n ip address 10.200.1.2 255.255.255.255\n!\ninterface Ethernet0/0\n description to CORE\n ip address 10.100.10.5 255.255.255.254\n no shutdown\n!\ninterface Ethernet0/1\n description to SUB (mobile core)\n no ip address\n no shutdown\n!\ninterface Ethernet0/1.130\n encapsulation dot1Q 130\n ip vrf forwarding MOB-A\n ip address 100.64.0.1 255.255.255.0\n!\ninterface Ethernet0/1.140\n encapsulation dot1Q 140\n ip vrf forwarding MOB-B\n ip address 100.64.1.1 255.255.255.0\n!\ninterface Ethernet0/2\n description to INET-SRV\n ip vrf forwarding INET\n ip address 192.0.2.1 255.255.255.0\n no shutdown\n!\ninterface Ethernet0/3\n description to COLLECTOR (TLM)\n ip vrf forwarding TLM\n ip address 10.200.0.1 255.255.255.252\n no shutdown\n!\nend"
