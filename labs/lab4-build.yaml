- boot_disk_size: null
  configuration:
  - name: node.cfg
    content: 'hostname SUB

      sh -c ''echo  | base64 -d > /etc/motd && chmod 644 /etc/motd''

      ip addr add 10.250.0.16/24 dev eth1

      ip link set eth1 up

      ntpd -p 10.250.0.11


      # L1: VLAN 130 (MOB-A) and 140 (MOB-B) towards PE-ACC

      modprobe 8021q

      ip link set eth0 up

      ip link add link eth0 name eth0.130 type vlan id 130

      ip link add link eth0 name eth0.140 type vlan id 140

      ip addr add 100.64.0.2/24 dev eth0.130

      ip addr add 100.64.1.2/24 dev eth0.140

      ip link set eth0.130 up

      ip link set eth0.140 up


      # L3: subscriber aliases, source-based routing and traffic scripts

      ip addr add 100.64.0.3/24 dev eth0.130

      ip addr add 100.64.1.3/24 dev eth0.140

      ip addr add 100.64.0.10/24 dev eth0.130

      ip addr add 100.64.1.10/24 dev eth0.140

      ip addr add 100.64.0.20/24 dev eth0.130

      ip addr add 100.64.1.20/24 dev eth0.140

      ip addr add 100.64.0.24/24 dev eth0.130

      ip addr add 100.64.1.24/24 dev eth0.140

      ip addr add 100.64.0.25/24 dev eth0.130

      ip addr add 100.64.1.25/24 dev eth0.140

      ip addr add 100.64.0.26/24 dev eth0.130

      ip addr add 100.64.1.26/24 dev eth0.140

      ip addr add 100.64.0.28/24 dev eth0.130

      ip addr add 100.64.1.28/24 dev eth0.140

      ip addr add 100.64.0.30/24 dev eth0.130

      ip addr add 100.64.1.30/24 dev eth0.140

      ip addr add 100.64.0.40/24 dev eth0.130

      ip addr add 100.64.1.40/24 dev eth0.140

      ip addr add 100.64.0.50/24 dev eth0.130

      ip addr add 100.64.1.50/24 dev eth0.140

      ip addr add 100.64.0.60/24 dev eth0.130

      ip addr add 100.64.1.60/24 dev eth0.140

      ip addr add 100.64.0.80/24 dev eth0.130

      ip addr add 100.64.1.80/24 dev eth0.140

      ip addr add 100.64.0.100/24 dev eth0.130

      ip addr add 100.64.1.100/24 dev eth0.140

