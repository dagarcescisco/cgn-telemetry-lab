  text_content: "LAB STATE\nStage S2 - CONNECTIVITY (L1)\n\nWHAT IS THERE (new)\n- An IP on every link (/31), loopbacks\n- LACP bundle PE-CGN: Be11 (XR) and\n  Po11 (C8000V), 2 members\n- dot1q subinterfaces per service:\n  130/131 MOB-A, 140/141 MOB-B,\n  170 TLM\n- VRFs on PE-ACC, PE and CGN (on the\n  CGN they are VRF-lite: no MPLS/BGP)\n\nWHAT IS NOT THERE (yet)\n- Routing, RT, NAT\n\nWHAT TO TRY\n- ping only between direct neighbors\n- show bundle / show etherchannel\n- show ip vrf ; ping vrf MOB-A ...\n- Verify: labcheck 2 (on COLLECTOR)\n\nVALUE\nEach VLAN is a service. CGN inside\nand outside travel over the same\nbundle in different VLANs.\n\nNEXT: S3 Routing (L2)"
