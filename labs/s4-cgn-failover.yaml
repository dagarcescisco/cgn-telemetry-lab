  text_content: "LAB STATE\nStage S4 - CGN AND FAILOVER (L3)\n\nWHAT IS THERE (new)\n- NAT44 CGN mode: overload, one pool\n  per VRF and per site, 300/host limit\n- INET-SRV: /ip shows the IP it sees\n- SUB: aliases and traffic scripts\n\nWHAT IS NOT THERE (yet)\n- NAT logs, telemetry, SNMP and\n  syslog (next: observability)\n\nWHAT TO TRY (on SUB)\n- normal.sh: public IP per alias\n- failover.sh 50 while you shut down\n  Be11 on PE-A\n- abusive.sh 400 and show ip nat\n  statistics (In-to-out drops)\n- Dial: ip ospf cost 100 on CORE\n- Continuous traffic: loop.sh start|stop\n- Verify: labcheck 4 (on COLLECTOR)\n\nVALUE\nSee a site failure end to end: the\nclient changes pool within seconds\nand everything moves to the other site.\n\nNEXT: S5 Observability"
