      ip addr add 100.64.1.200/24 dev eth0.140

      ip addr add 100.64.0.240/24 dev eth0.130

      ip addr add 100.64.1.240/24 dev eth0.140

      ip route replace 192.0.2.0/24 via 100.64.0.1 dev eth0.130

      ip route replace 192.0.2.0/24 via 100.64.1.1 dev eth0.140 table 140

