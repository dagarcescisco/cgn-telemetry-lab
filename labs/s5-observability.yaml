  border_style: ''
  color: '#000000'
  rotation: 0
  text_bold: false
  text_content: 'PE<->CGN subinterfaces: 130 MOB-A | 131 INET (MOB-A) | 140 MOB-B | 141 INET (MOB-B) | 170 TLM

    Images: XRv9000 25.1.1 (20 GB, ~11 min boot) | C8000V 17.16.01a | IOL 17.16.01a | Ubuntu 24.04 | Alpine 3.21'
  text_font: monospace
  text_italic: false
  text_size: 10
  text_unit: pt
  thickness: 1
  type: text
  x1: -560.0
  y1: 760.0
  z_index: 1
- border_color: '#00000000'
  border_style: ''
  color: '#000000'
  rotation: 0
  text_bold: false
  text_content: 'VLAN / IP (one VRF per service on PE-ACC)

    MOB-A  VLAN 130  100.64.0.0/24

    MOB-B  VLAN 140  100.64.1.0/24

    SUB: .2 in each VLAN, gw .1'
  text_font: monospace
  text_italic: false
  text_size: 12
  text_unit: pt
  thickness: 1
  type: text
  x1: -560.0
  y1: -80.0
  z_index: 1
- border_color: '#00000000'
  border_style: ''
  color: '#000000'
  rotation: 0
  text_bold: false
  text_content: 'INET 192.0.2.0/24 (INET-SRV .10)

    NAT pools 203.0.113.x:

    A: .0/30 MOB-A  .4/30 MOB-B

    B: .8/30 MOB-A  .12/30 MOB-B'
  text_font: monospace
  text_italic: false
  text_size: 12
  text_unit: pt
  thickness: 1
