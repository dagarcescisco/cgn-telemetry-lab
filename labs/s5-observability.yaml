  color: '#000000'
  rotation: 0
  text_bold: false
  text_content: 'OOB 10.250.0.0/24 (global table)

    .10 COLLECTOR (jump host)  .11 CORE

    .12 PE-A  .13 PE-B  .14 CGN-A1  .15 CGN-B1

    .16 SUB  .17 INET-SRV  .18 PE-ACC  .19 BROWSER

    From COLLECTOR: ssh to all

