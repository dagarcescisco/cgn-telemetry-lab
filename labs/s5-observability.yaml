      ip addr add 10.250.0.16/24 dev eth1

      ip link set eth1 up

      ntpd -p 10.250.0.11


      # L1: VLAN 130 (MOB-A) and 140 (MOB-B) towards PE-ACC

      modprobe 8021q

      ip link set eth0 up

      ip link add link eth0 name eth0.130 type vlan id 130

      ip link add link eth0 name eth0.140 type vlan id 140

      ip addr add 100.64.0.2/24 dev eth0.130

      ip addr add 100.64.1.2/24 dev eth0.140

      ip link set eth0.130 up

      ip link set eth0.140 up


      # L3: subscriber aliases, source-based routing and traffic scripts

