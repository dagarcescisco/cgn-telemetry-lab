  border_style: ''
  color: '#000000'
  rotation: 0
  text_bold: false
  text_content: "COLLECTOR STACK (Docker, 3 containers)\nTelegraf: NetFlow v9 UDP 9996 | syslog UDP 514\n          MDT XR TCP 57000 | MDT XE gRPC 58000\n          SNMP v2c polling over OOB\nInfluxDB :8086  ->  Grafana :3000 (no login)\nNodes send from Lo2 via VRF TLM (10.200.1.x)\nXR dials out from the link IP: COLLECTOR has\na route to 10.100.0.0/16"
  text_font: monospace
  text_italic: false
  text_size: 12
  text_unit: pt
  thickness: 1
  type: text
  x1: 440.0
  y1: -320.0
  z_index: 1
- border_color: '#00000000'
  border_style: ''
  color: '#000000'
  rotation: 0
  text_bold: false
  text_content: 'CORE = P + RR (no VRFs), Lo0 .1

    /31 links (10.100.10.x):

    PE-A .0 | PE-B .2 | PE-ACC .4'
  text_font: monospace
  text_italic: false
  text_size: 12
  text_unit: pt
  thickness: 1
  type: text
  x1: 190.0
  y1: -40.0
  z_index: 1
- border_color: '#00000000'
  border_style: ''
  color: '#000000'
  rotation: 0
  text_bold: false
  text_content: 'SITE A  10.100.1.0/24

    PE-A XRv9000 Lo0 .11  (Bundle-Ether11)

    CGN-A1 C8000V Lo0 .21 (Port-channel11)

    LACP 2 x Gi: Gi0/0/0/1-2 <-> Gi2-3'
  text_font: monospace
  text_italic: false
  text_size: 12
  text_unit: pt
  thickness: 1
  type: text
  x1: -480.0
  y1: 620.0
  z_index: 1
- border_color: '#00000000'
  border_style: ''
  color: '#000000'
  rotation: 0
  text_bold: false
  text_content: 'SITE B  10.100.2.0/24

    PE-B XRv9000 Lo0 .12  (Bundle-Ether11)

    CGN-B1 C8000V Lo0 .22 (Port-channel11)

    LACP 2 x Gi: Gi0/0/0/1-2 <-> Gi2-3'
  text_font: monospace
  text_italic: false
  text_size: 12
  text_unit: pt
  thickness: 1
  type: text
  x1: 120.0
  y1: 620.0
  z_index: 1
- border_color: '#00000000'
  border_style: ''
  color: '#000000'
  rotation: 0
  text_bold: false
  text_content: 'ROUTING (L2)

    OSPF area 0 MD5 + BFD 500ms x4 + LDP

    iBGP AS 65001, CORE = RR (VPNv4)

    PE-ACC = PC_PE: ECMP A + B per VRF

    Dial: OSPF cost (10) of the link to a site'
  text_font: monospace
  text_italic: false
  text_size: 12
  text_unit: pt
  thickness: 1
  type: text
  x1: 500.0
  y1: 180.0
  z_index: 1
- border_color: '#00000000'
  border_style: ''
  color: '#000000'
  rotation: 0
  text_bold: false
  text_content: 'RT (the switch)

    Subscribers 1101 MOB-A | 1102 MOB-B

    Default A 2201/2202 | B 2301/2302

    INET 9001 | TLM 9901 (65001:x)'
  text_font: monospace
  text_italic: false
  text_size: 12
  text_unit: pt
  thickness: 1
  type: text
  x1: 500.0
  y1: 320.0
  z_index: 1
- border_color: '#00000000'
  border_style: ''
  color: '#000000'
  rotation: 0
  text_bold: false
  text_content: 'BROWSER 10.250.0.19 (Chrome)

    Open its graphic console: Grafana

    shows Sites and Devices dashboards'
  text_font: monospace
  text_italic: false
  text_size: 12
  text_unit: pt
  thickness: 1
  type: text
  x1: 920.0
  y1: -40.0
  z_index: 1
- border_color: '#00000000'
  border_style: ''
  color: '#000000'
  rotation: 0
  text_bold: false
  text_content: 'CGN (L3)

    NAT44 CGN mode, overload, one pool per VRF

    Per-host limit: 300 (didactic)

    Test: SUB> normal.sh | ipcheck.sh A

    Failure: shutdown Be11 on PE or Et0/x on CORE'
  text_font: monospace
  text_italic: false
  text_size: 12
  text_unit: pt
  thickness: 1
  type: text
  x1: 500.0
  y1: 450.0
  z_index: 1
- border_color: '#00000000'
  border_style: ''
  color: '#000000'
  rotation: 0
  text_bold: false
  text_content: "LAB STATE\nStage S5 - OBSERVABILITY (L4/L5)\n\nWHAT IS THERE (new)\n- NAT events: NetFlow v9 from each CGN\n- Syslog from the 6 network nodes\n- MDT: XR over TCP, XE over gRPC\n- SNMP v2c polling (compare with MDT)\n- Telegraf + InfluxDB + Grafana on\n  COLLECTOR; BROWSER node (Chrome)\n\nWHAT TO TRY\n- BROWSER console: dashboards Sites\n  and Devices (refresh every 10 s)\n- SUB: loop.sh start, then shut down\n  Be11 on PE-A and watch Sites\n- show telemetry model-driven\n  subscription (XR) / show telemetry\n  ietf subscription all (XE)\n- Stop the collector: routing and NAT\n  keep working\n- Verify: labcheck 5 (on COLLECTOR)\n\nVALUE\nEvery symptom has a source: counters\n(MDT/SNMP), events (syslog) and who\ntalked to whom (NetFlow).\n\nNEXT: S6 Freeze and derive stages"
  text_font: monospace
  text_italic: false
  text_size: 11
  text_unit: pt
